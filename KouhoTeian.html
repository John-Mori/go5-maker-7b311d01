<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投稿提案 / 決定</title>
<style>
  /* ★白系(ホワイト)配色 — ベース=クリーム/白・文字=濃紺〜黒・アクセントはティール #2bb3c0 (Chami追補【1】2026-08-23)。
     Claude標準の紫は不使用。候補ページ(KouhoLists.html)風に白面+淡いボーダー/シャドウ。 */
  :root{
    --bg:#fffdf6; --card:#ffffff; --card2:#faf8f0; --field:#f4f2ea; --line:#e6e2d6; --line2:#d8d3c4;
    --accent:#2bb3c0; --accent-ink:#04222a; --ink:#1a1a2e; --muted:#5f6675; --dim:#8b93a2;
    --canvas:#f0eee6; --ok:#2f9e6a; --warn:#c07a2a;
    --shadow:0 1px 2px rgba(26,26,46,.06), 0 2px 10px rgba(26,26,46,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:var(--accent)}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 120px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 12px}
  header h1{font-size:1.05rem;font-weight:800;color:var(--accent);margin:0;letter-spacing:.01em}
  header .date{font-size:.78rem;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .panel .head{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  label.mini{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 4px}
  input[type=text],input[type=url],input[type=password],textarea,select{
    width:100%;background:var(--field);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:9px 10px;font-size:.86rem;font-family:inherit}
  textarea{resize:vertical;line-height:1.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font-family:inherit;cursor:pointer}
  .btn{width:auto;flex:0 0 auto;background:var(--field);border:1px solid var(--line2);color:var(--muted);
    border-radius:8px;padding:8px 12px;font-size:.8rem}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border:none;color:var(--accent-ink);font-weight:700}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed}
  .btn.full{width:100%;flex:1 1 100%;padding:12px;border-radius:10px;font-size:.92rem}
  .hint{font-size:.74rem;color:var(--dim);line-height:1.5}
  details.cfg summary{cursor:pointer;font-size:.76rem;color:var(--muted);list-style:none}
  details.cfg summary::-webkit-details-marker{display:none}
  details.cfg summary::before{content:"⚙ ";}
  /* candidate card */
  .cand{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
  .cand.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cand .top{display:flex;gap:8px;align-items:flex-start}
  .rank{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--field);border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted)}
  .title{font-size:.9rem;font-weight:700;line-height:1.35;margin:0}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{font-size:.68rem;color:var(--muted);background:var(--field);border:1px solid var(--line2);
    border-radius:999px;padding:3px 8px;white-space:nowrap}
  .chip.lp{color:var(--muted);background:var(--field);border:1px solid var(--line2)}
  .chip.lp.new{color:var(--accent-ink);background:var(--accent);border:none;font-weight:700}
  /* 投稿用画像(=動画のメイン材料)= 1枚をサムネ表示。タップでサンプル画像ぜんぶをライトボックス表示。
     候補ページ(KouhoLists)のサムネ→モーダルと同じ作法(Chami 2026-08-23)。 */
  .hero{position:relative;display:inline-block;margin:6px 0 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hero img{height:160px;width:auto;max-width:100%;border-radius:10px;background:var(--canvas);
    border:1px solid var(--line);object-fit:cover;display:block}
  .hero .cnt{position:absolute;right:6px;bottom:6px;font-size:.66rem;font-weight:700;color:#fff;
    background:rgba(0,0,0,.55);border-radius:999px;padding:2px 8px;pointer-events:none}
  .hero .tap{position:absolute;left:6px;bottom:6px;font-size:.62rem;color:#fff;
    background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px;pointer-events:none}
  /* 絞り込み */
  .filters{display:flex;flex-wrap:wrap;gap:8px}
  .fchk{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink);
    background:var(--field);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;cursor:pointer}
  .fchk input{margin:0}
  /* 2グループの切替トグル(今すぐ投稿できる ⇄ 紹介にはアツい) */
  .gtabs{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .gtabs button{flex:1 1 0;background:var(--card);border:none;color:var(--muted);
    padding:10px 8px;font-size:.84rem;font-weight:700;line-height:1.3;transition:background .12s}
  .gtabs button + button{border-left:1px solid var(--line2)}
  .gtabs button .gc{display:block;font-size:.68rem;font-weight:600;color:var(--dim);margin-top:2px}
  .gtabs button.on.ready{background:var(--accent);color:var(--accent-ink)}
  .gtabs button.on.pool{background:var(--warn);color:#fff}
  .gtabs button.on .gc{color:inherit;opacity:.82}
  .gdesc{font-size:.72rem;color:var(--dim);margin:8px 2px 10px;line-height:1.5}
  /* 画像2枚並び: 左=動画生成用画像(素材) / 右=サンプル(FANZA・タップで全画像) */
  .imgrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0 8px}
  .imgrow .hero{margin:0}
  .genimg{flex:0 0 auto;position:relative}
  .genimg img{height:160px;width:auto;max-width:44vw;border-radius:10px;border:1px solid var(--line);
    background:var(--canvas);object-fit:cover;display:block;cursor:pointer}
  .genimg .lbl{position:absolute;left:6px;top:6px;font-size:.6rem;font-weight:700;color:#fff;
    background:rgba(43,179,192,.92);border-radius:6px;padding:2px 6px;pointer-events:none}
  .genimg.none{height:160px;width:118px;border:1px dashed var(--line2);border-radius:10px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);
    font-size:.68rem;line-height:1.4;padding:6px}
  /* サンプル画像ライトボックス(タップで全画像) */
  .imodal{position:fixed;inset:0;z-index:80;background:rgba(20,18,12,.88);display:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .imodal.on{display:block}
  .imodal .ihead{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:12px 14px;background:rgba(20,18,12,.72);backdrop-filter:blur(4px)}
  .imodal .ihead .it{font-size:.86rem;font-weight:700;color:#fff;line-height:1.3;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imodal .iclose{flex:0 0 auto;background:rgba(255,255,255,.16);border:none;color:#fff;
    border-radius:999px;width:34px;height:34px;font-size:1rem;line-height:1}
  .imodal .igal{max-width:560px;margin:0 auto;padding:10px 12px 40px}
  .imodal .igal img{width:100%;height:auto;border-radius:10px;margin-bottom:10px;background:#000;display:block}
  .cmts{margin:6px 0 2px}
  .cmt{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;background:var(--field)}
  .cmt input{margin-top:3px}
  .cmt .ctext{font-size:.86rem;line-height:1.4}
  .cmt .caim{font-size:.66rem;color:var(--dim);margin-top:2px}
  .noc{font-size:.76rem;color:var(--warn);margin:4px 0 8px}
  /* 部屋コメント (三笘薫 / 早坂芽衣) — 作品の下に2枠 */
  .rooms{margin:10px 0 2px;display:flex;flex-direction:column;gap:7px}
  .rmc{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border:1px solid var(--line);
    border-radius:10px;background:var(--card)}
  .rmc.mi{background:rgba(43,179,192,.07);border-color:rgba(43,179,192,.28)}
  .rmc.me{background:rgba(192,122,42,.08);border-color:rgba(192,122,42,.28)}
  .rmc .ava{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:.74rem;font-weight:800;color:var(--accent-ink);overflow:hidden}
  .rmc .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .rmc.mi .ava{background:var(--accent)}
  .rmc.me .ava{background:var(--warn)}
  .rmc .body{min-width:0;flex:1 1 auto}
  .rmc .who{font-size:.68rem;font-weight:700;color:var(--muted);margin-bottom:2px}
  .rmc.mi .who{color:var(--accent)}
  .rmc.me .who{color:var(--warn)}
  .rmc .rtext{font-size:.82rem;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .cand label.mini{margin-top:6px}
  .decide-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .segch{display:flex;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .segch button{width:auto;flex:0 0 auto;background:var(--field);border:none;color:var(--muted);
    padding:7px 12px;font-size:.78rem}
  .segch button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  /* ② チャンネルボタンは各テーマカラー準拠(月詠み=藍紫 / 宵桜=緋桜。本体のrank-acct色を踏襲)Chami指示 2026-08-23 */
  .segch button.on[data-ch="acc1"]{background:#5A72B8;color:#fff}
  .segch button.on[data-ch="acc2"]{background:#B25C86;color:#fff}
  /* ③ 「この作品で決定」はオレンジ(Chami指示 2026-08-23) */
  .pickBtn.primary{background:#e8801a;color:#fff}
  .pickBtn.primary:hover{background:#d6720f}
  /* sticky decision bar */
  .decbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,246,.96);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter:blur(6px)}
  .decbar .inner{max-width:520px;margin:0 auto}
  .decbar .sum{font-size:.78rem;color:var(--muted);margin-bottom:8px;line-height:1.4}
  .decbar .sum b{color:var(--ink)}
  .status{font-size:.78rem;margin-top:8px;min-height:1em}
  .status.ok{color:var(--ok)} .status.err{color:#d64545} .status.busy{color:var(--warn)}
  .empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:.86rem;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>投稿提案 / 決定</h1>
    <span class="date" id="date">—</span>
  </header>

  <div class="panel" id="loader">
    <div class="head">候補を読み込む</div>
    <button class="btn primary full" id="loadDaily" style="margin-bottom:10px">🔄 今日の候補を読み込む</button>
    <div class="hint" id="dailyHint" style="margin:-4px 0 10px">端末から当日分を取り込みます (同期の設定が要ります)。</div>
    <details class="cfg" style="margin-bottom:8px"><summary>手動で読み込む (ファイル / 貼り付け / URL)</summary>
    <div class="row" style="margin-top:8px">
      <input type="file" id="file" accept="application/json,.json" style="flex:1 1 auto">
    </div>
    <label class="mini">または JSON を貼り付け</label>
    <textarea id="paste" rows="3" placeholder='{"date":"…","candidates":[…]}'></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="loadPaste">貼り付けを読み込む</button>
      <button class="btn" id="loadUrl">URL から取得</button>
    </div>
    <div class="hint" style="margin-top:6px">URL 取得は <code>?src=</code> でも自動。前回の読み込みは端末に残ります。</div>
    </details>
  </div>

  <details class="cfg panel">
    <summary>送信先の設定 (GAS)</summary>
    <label class="mini">GAS Web App URL</label>
    <input type="url" id="gasUrl" placeholder="https://script.google.com/…/exec">
    <label class="mini">共有シークレット (任意)</label>
    <input type="password" id="gasSecret" placeholder="SHARED_SECRET">
    <div class="hint" style="margin-top:6px">未入力なら本体アプリの設定 (bsky_gas_url / bsky_gas_secret) を使います。</div>
  </details>

  <div class="panel" id="filterPanel" style="display:none">
    <div class="head">絞り込み</div>
    <div class="filters">
      <label class="fchk"><input type="checkbox" id="fSale"><span>セール中</span></label>
      <label class="fchk"><input type="checkbox" id="fHideTsuku"><span>月詠み投稿済みを隠す</span></label>
      <label class="fchk"><input type="checkbox" id="fHideYoi"><span>宵桜投稿済みを隠す</span></label>
    </div>
    <div class="hint" id="filterCount" style="margin-top:6px"></div>
  </div>

  <div id="groupTabs" style="display:none"></div>
  <div id="list"></div>
</div>

<div class="decbar" id="decbar" style="display:none">
  <div class="inner">
    <div class="sum" id="decSum"></div>
    <button class="btn primary full" id="sendBtn" disabled>軍議へ決定を送る</button>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- 動画生成用画像(=候補タブでChamiが貼る素材)を cid で読むための土台。本体アプリと同一オリジン=
     同じ IndexedDB(go5store/kv の ref:<cid>)を読める。★?v= は付けない(このページは bump.mjs の
     TARGETS 外=?v= を持つと孤児検出でCIが赤になる。coreは安定ファイルなので素で読む)。 -->
<script src="core/util.js"></script>
<script src="core/idb-store.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n){ return (n==null||n==='')?'—':Number(n).toLocaleString('ja-JP'); }
  // ★候補提案ページのコメントは全部一行表記(Chami指示 2026-08-23・msg 1541167814570672190)。
  //   生成側の2行区切り '/' は候補ページでは開かず取り除く=表示・編集欄・決定値すべて1行。
  function twoLineHtml(s){ return esc((s||'').replace(/\s*\/\s*/g,'')); }
  function plainCmt(s){ return (s||'').replace(/\s*\/\s*/g,''); }
  // 技法ラベル(type)先頭の丸数字を落とす=画面に番号を出さない(選択肢1/2/3との混同回避・Chami指示 2026-08-24)。
  function deNum(s){ return (s||'').replace(/^[①-⑳㉑-㉟㊱-㊿]+\s*/,''); }
  var LS = window.localStorage;

  // 部屋コメントのアバター(R2恒久URL・local/persona_avatars.json由来。期限切れ根絶済み=2026-07-16)。
  var AVA_MITOMA = 'https://go5-sync.trustsignalbot.workers.dev/img/023b355179ae08bb4edcd7bb3b4bb3077f776667b29b577092c654b680f1abaa';
  var AVA_MEI = 'https://go5-sync.trustsignalbot.workers.dev/img/c3d0a55ef45363cd7f7155df762cbc03867f80aa50f307cea41feb5bc4e5a133';
  function avaHtml(url, letter){
    return '<img class="avaimg" data-fallback="'+esc(letter)+'" src="'+esc(url)+'" alt="">';
  }
  // 画像取得に失敗しても壊れたアイコンのまま出さない(fail-open=文字アバターへ差し戻す)。errorはbubbleしないのでcapture。
  document.addEventListener('error', function(e){
    var t = e.target;
    if(t && t.classList && t.classList.contains('avaimg')){
      var span = document.createElement('span');
      span.textContent = t.getAttribute('data-fallback') || '';
      t.replaceWith(span);
    }
  }, true);

  // ---- 設定 (本体アプリと同一オリジン=localStorage共有) ----
  function gasUrl(){ return ($('#gasUrl').value.trim()) || LS.getItem('bsky_gas_url') || ''; }
  function gasSecret(){ var v=$('#gasSecret').value; return v!=='' ? v : (LS.getItem('bsky_gas_secret')||''); }
  $('#gasUrl').value = LS.getItem('teian_gas_url') || LS.getItem('bsky_gas_url') || '';
  $('#gasSecret').value = LS.getItem('teian_gas_secret') || '';
  $('#gasUrl').addEventListener('change', function(){ LS.setItem('teian_gas_url', this.value.trim()); });
  $('#gasSecret').addEventListener('change', function(){ LS.setItem('teian_gas_secret', this.value); });

  // ---- 決定の状態 ----
  var DATA = null;
  var pick = { id:null, cid:null, title:null, platform:null, channel:null, comment:'' };

  function renderEmpty(msg){
    $('#list').innerHTML = '<div class="empty">'+esc(msg)+'</div>';
    $('#groupTabs').style.display='none';
    $('#decbar').style.display='none';
  }

  function candChannel(c){ return c.channel || 'acc1'; }
  function chName(ch){ return ch==='acc2' ? '宵桜艶帖' : (ch==='acc1' ? '月詠み' : (ch||'')); }
  // 最終投稿タグ(Chami追補【1】2026-08-23)。旧「月詠み用/宵桜用」の割当表示は廃止=作品はどちらでも可。
  // last_posted:{date,channel} は商品候補選定部門が候補へ足す想定(未着任なら null 扱い=fail-open)。
  function lastPostedChip(c){
    var lp = c.last_posted;
    if(!lp || !lp.date){ return '<span class="chip lp new">未投稿</span>'; }
    var parts = String(lp.date).split('-');
    var md = parts.length>=3 ? (parseInt(parts[1],10)+'/'+parseInt(parts[2],10)) : esc(lp.date);
    return '<span class="chip lp">最終投稿 '+md+' '+esc(chName(lp.channel))+'</span>';
  }

  function render(){
    if(!DATA || !DATA.candidates || !DATA.candidates.length){ renderEmpty('候補がありません。JSON を読み込んでください。'); return; }
    $('#date').textContent = DATA.date || '';
    var all = DATA.candidates.slice().sort(function(a,b){
      return ((b.metrics&&b.metrics.score)||0) - ((a.metrics&&a.metrics.score)||0); });
    var cands = all.filter(passFilter_);
    $('#filterPanel').style.display='block';
    $('#filterCount').textContent = cands.length + ' / ' + all.length + ' 件を表示';
    // 2グループに分けて切替表示(Chami指示2026-08-23→2026-08-24 上下でなく切替ボタン):
    //   ready=今すぐ投稿できる(動画生成用画像あり) / pool=紹介にはアツい(画像なし)。どちらも score 降順のまま。
    var ready=[], pool=[];
    cands.forEach(function(c){ ((REF[c.cid]||{}).has ? ready : pool).push(c); });
    // ★readyは「当日候補JSONに載っている物」だけでは常時0になりうる(候補が全部新規作品でREF未取得の日)。
    //   真因対策(2026-08-24): REFで has=true の"全cid"を和集合として足す。DATA(cands)に居ない
    //   cid = Chamiが候補タブ(cand_items)に投稿用画像だけ貼った作品 = loadLibMap_() から最低限のカードを合成する。
    //   同一cidがDATAにも居る場合(=フィルタで除外された等)はDATA優先・ライブラリでの復活はしない。
    //   ★cands.length===0(絞り込みで全滅)でもここは動かす=フィルタが効いていてもライブラリ分は出す。
    var readyCids = {}; ready.forEach(function(c){ if(c.cid) readyCids[c.cid]=true; });
    var allCidMap = {}; all.forEach(function(c){ if(c.cid && !allCidMap[c.cid]) allCidMap[c.cid]=c; });
    // ★投稿件数の縛り(Chami指示 2026-08-23・msg 1541174987971493898)=生成側の除外(直近3日∪直近10件)を
    //   ライブラリ合流分にも効かせる。候補JSONの excluded_cids は生成側(candidates_json.py)が配る同じ集合=
    //   ページで数え直さない(single-source)。空/未配布なら弾かない(fail-open=投稿済みが混じっても表示は続く)。
    var EXCL = {}; (DATA.excluded_cids||[]).forEach(function(cid){ if(cid) EXCL[cid]=true; });
    var LIBMAP = loadLibMap_();
    Object.keys(REF).forEach(function(cid){
      if(readyCids[cid]) return;                 // 既にDATA由来でready入り済み
      if(!(REF[cid]||{}).has) return;             // 動画生成用画像が無いcidは対象外
      if(allCidMap[cid]) return;                  // DATAに存在=絞り込みで意図的に除外された物。合成で復活させない
      if(EXCL[cid]) return;                        // 直近3日∪直近10件で投稿済み=合流でも復活させない(投稿件数の縛り)
      var lib = LIBMAP[cid] || {};
      var libCand = { id:'lib-'+cid, cid:cid, platform:(cid.indexOf('d_')===0?'doujin':'books'),
        title:(lib.title||cid), images:(lib.thumb?[lib.thumb]:[]),
        metrics:{price:lib.price, discount_pct:lib.discountPct}, comments:[], room_comments:null,
        last_posted:null, _fromLibrary:true };
      if(!passFilter_(libCand)) return;
      ready.push(libCand); readyCids[cid]=true;
    });
    ready.sort(function(a,b){ return ((b.metrics&&b.metrics.score)||0) - ((a.metrics&&a.metrics.score)||0); });
    if(!cands.length && !ready.length){ $('#list').innerHTML='<div class="empty">絞り込みに合う候補がありません。条件を外してください。</div>'; $('#groupTabs').style.display='none'; $('#decbar').style.display='none'; return; }
    var g = groupGet_();
    if(g==='ready' && !ready.length && pool.length) g='pool';       // 選択側が空なら中身のある側へ寄せる
    if(g==='pool' && !pool.length && ready.length) g='ready';
    $('#groupTabs').style.display='block';
    $('#groupTabs').innerHTML = gtabsHtml_(ready.length, pool.length, g);
    document.querySelectorAll('#groupTabs button[data-group]').forEach(function(b){
      b.addEventListener('click', function(){ groupSet_(b.dataset.group); render(); });
    });
    var active = (g==='pool') ? pool : ready;
    var descs = { ready:'動画生成用画像あり=そのまま動画にできる。',
                  pool:'動画生成用画像はまだ無い。サンプル画像を素材に仕込めば投稿できる (モノクロはフルカラー化)。' };
    var html = '<div class="gdesc">'+esc(descs[g])+'</div>';
    if(active.length){ active.forEach(function(c,i){ html += cardHtml_(c, i+1); }); }
    else { html += '<div class="empty">この区分に合う候補はありません。</div>'; }
    $('#list').innerHTML = html;
    wire(active);  // ★activeで検索(readyはlib合成カードを含みcandsの部分集合でなくなったため=cands指定だとlib分のクリックが引けない)
  }

  // グループ切替(端末に保存)。ready=今すぐ投稿できる / pool=紹介にはアツい。
  function groupGet_(){ try{ return LS.getItem('teian_group')==='pool'?'pool':'ready'; }catch(e){ return 'ready'; } }
  function groupSet_(g){ try{ LS.setItem('teian_group', g==='pool'?'pool':'ready'); }catch(e){} }

  // ---- サンプル画像ライトボックス(候補ページと同じ作法=サムネ表示のみ+タップで全画像) ----
  var _imodal = null;
  function ensureImodal_(){
    if(_imodal) return _imodal;
    var m = document.createElement('div'); m.className='imodal';
    m.innerHTML = '<div class="ihead"><span class="it"></span><button type="button" class="iclose" aria-label="閉じる">✕</button></div><div class="igal"></div>';
    document.body.appendChild(m);
    function close(){ m.classList.remove('on'); document.body.style.overflow=''; }
    m.addEventListener('click', function(e){ if(e.target===m) close(); });
    m.querySelector('.iclose').addEventListener('click', close);
    _imodal = m; return m;
  }
  function openImagesModal_(title, imgs){
    var m = ensureImodal_();
    m.querySelector('.it').textContent = title||'(無題)';
    m.querySelector('.igal').innerHTML = (imgs&&imgs.length)
      ? imgs.map(function(u){ return '<img loading="lazy" src="'+esc(u)+'" alt="">'; }).join('')
      : '<div style="color:#eee;text-align:center;padding:24px">画像がありません</div>';
    m.scrollTop = 0; m.classList.add('on'); document.body.style.overflow='hidden';
  }
  function openGallery_(c){ openImagesModal_(c.title, c.images||[]); }

  // ---- 動画生成用画像(候補タブでChamiが貼る素材・本体と同じ IDB go5store/kv の ref:<cid>)----
  var REF = {};  // cid → {imgs:[dataURL], has:bool}
  // ★画像の同一性判定(動画作成用モーダルの「通常/使用済み/除外」マーク機能)。djb2ハッシュ。
  //   js/candidates.js と同一実装を置く(2ファイル一致必須・どちらか片方だけ直さない)。
  function imgHash_(s){ s=String(s||''); var h=5381,i=s.length; while(i){ h=((h*33)^s.charCodeAt(--i))>>>0; } return h.toString(36); }
  // 画像マーク(cand_img_marks・js/candidates.jsが書く { "<cid>": { "<hash>": "used"|"excluded" | {s,at} } })の読み取り専用参照。
  function imgMarksMap_(){ try{ return JSON.parse(LS.getItem('cand_img_marks')||'{}')||{}; }catch(e){ return {}; } }
  // マーク値は文字列 or {s,at}(使用日つき)の2形。状態文字列に正規化する(js/candidates.js の mkState_ と一致必須)。
  function markState_(v){ return (v && typeof v==='object') ? String(v.s||'') : String(v||''); }
  // used/excluded マークが付いた画像を候補から除外する。
  function filterMarked_(cid, imgs){
    var m = imgMarksMap_()[cid] || {};
    return (imgs||[]).filter(function(im){ var st=markState_(m[imgHash_(im)]); return st!=='used' && st!=='excluded'; });
  }
  function refInfoFromRec_(rec){
    if(!rec) return {imgs:[], has:false};
    if(Array.isArray(rec.imgs)){ var a=rec.imgs.filter(Boolean); return {imgs:a, has:a.length>0}; }
    if(rec.img) return {imgs:[rec.img], has:true};
    if(rec.__r2n>0) return {imgs:[], has:true};   // 別端末に在る(この端末に未取得)
    return {imgs:[], has:false};
  }
  // マーク済み(used/excluded)画像を除いた上で {imgs,has} を確定する。未取得(__r2n>0=imgs空でhas true)は
  //   マークと無関係なので触らない。フィルタ対象はimgsが実在した時のみ・全除外なら素材無し扱い(has=false)へ落とす。
  function applyMarkFilter_(cid, info){
    if(!info || !info.imgs.length) return info;
    var filtered = filterMarked_(cid, info.imgs);
    return filtered.length ? {imgs:filtered, has:true} : {imgs:[], has:false};
  }
  function loadRefMap_(){
    return new Promise(function(resolve){
      var map={};
      try{ // localStorage 退避も読む(IDBが間欠死する端末でも同期で拾える・本体と同じキー)
        for(var i=0;i<LS.length;i++){ var k=LS.key(i);
          if(k && k.indexOf('cand_refimg__')===0){
            try{ var cid=k.slice(13); var info=applyMarkFilter_(cid, refInfoFromRec_(JSON.parse(LS.getItem(k)))); if(info.imgs.length||info.has) map[cid]=info; }catch(e){}
          }
        }
      }catch(e){}
      if(window.Go5Idb && Go5Idb.available && Go5Idb.available()){
        Go5Idb.entriesByPrefixes(['ref:']).then(function(ent){
          try{ Object.keys(ent||{}).forEach(function(k){ var cid=k.slice(4); var info=applyMarkFilter_(cid, refInfoFromRec_(ent[k])); if(info.imgs.length||info.has) map[cid]=info; }); }catch(e){}
          resolve(map);
        }, function(){ resolve(map); });   // fail-open=読めなくても中身は出す
      } else resolve(map);
    });
  }
  // ---- 候補ライブラリ(候補タブでChamiが手動で貼った作品・localStorage cand_items + 独立タブ cand_items__<tabId>)----
  //   候補JSON(DATA.candidates)には載らないが投稿用画像だけ持つ作品を拾うための読み取り専用マップ。
  //   fail-open=壊れたJSON/読めないキーは無視して空のまま返す(取りこぼしより誤表示ゼロを優先)。
  function loadLibMap_(){
    var map = {};
    try{
      for(var i=0;i<LS.length;i++){
        var k = LS.key(i);
        if(!k || (k!=='cand_items' && k.indexOf('cand_items__')!==0)) continue;
        try{
          var arr = JSON.parse(LS.getItem(k));
          if(!Array.isArray(arr)) continue;
          arr.forEach(function(it){
            if(it && it.cid && !map[it.cid]){
              map[it.cid] = { title:it.title, thumb:it.thumb, url:it.url, price:it.price,
                discountPct:it.discountPct, author:it.author };
            }
          });
        }catch(e){}
      }
    }catch(e){}
    return map;
  }
  function genImgHtml_(c){
    var info = REF[c.cid] || {imgs:[], has:false};
    if(info.imgs.length){
      return '<div class="genimg" data-gen="'+esc(c.id)+'"><img loading="lazy" src="'+esc(info.imgs[0])+'" alt="動画生成用画像"><span class="lbl">動画生成用</span></div>';
    }
    if(info.has){ return '<div class="genimg none">動画生成用画像あり<br>(この端末に未取得)</div>'; }
    return '<div class="genimg none">動画生成用画像<br>なし</div>';
  }

  // ---- 絞り込み(端末に保存) ----
  // 「動画生成用画像あり」フィルタは2グループ切替へ統合(2026-08-24)=ここでは扱わない。
  // 「投稿済みを隠す」の"直近3日 OR 直近10件"の除外は生成側(daily_pick.py/candidates_json.py)で適用済み=
  // 候補JSONに来る時点で既に除外されている。ここのhideT/hideYは last_posted.channel(全期間)での追加絞り込み。
  var FK = { sale:'teian_f_sale', hideT:'teian_f_hidetsuku', hideY:'teian_f_hideyoi' };
  function fget(k){ try{ return LS.getItem(k)==='1'; }catch(e){ return false; } }
  function fset(k,v){ try{ LS.setItem(k, v?'1':'0'); }catch(e){} }
  function passFilter_(c){
    if(fget(FK.sale)){ var d=(c.metrics||{}).discount_pct; if(!(d>0)) return false; }
    var lp=c.last_posted||{};
    if(fget(FK.hideT) && lp.channel==='月詠み') return false;
    if(fget(FK.hideY) && lp.channel==='宵桜艶帖') return false;
    return true;
  }
  function initFilters_(){
    var pairs=[['#fSale',FK.sale],['#fHideTsuku',FK.hideT],['#fHideYoi',FK.hideY]];
    pairs.forEach(function(p){
      var el=$(p[0]); if(!el) return;
      el.checked=fget(p[1]);
      el.addEventListener('change', function(){ fset(p[1], el.checked); render(); });
    });
  }

  function wire(cands){
    // 動画生成用画像(左)→ タップで拡大
    document.querySelectorAll('.genimg[data-gen]').forEach(function(g){
      g.addEventListener('click', function(){
        var c = cands.filter(function(x){ return x.id===g.dataset.gen; })[0];
        var info = c && REF[c.cid];
        if(info && info.imgs.length) openImagesModal_((c.title||'')+' (動画生成用画像)', info.imgs);
      });
    });
    // サンプル(右)サムネ → タップでサンプル画像ライトボックス
    document.querySelectorAll('.hero').forEach(function(h){
      h.addEventListener('click', function(){
        var c = cands.filter(function(x){ return x.id===h.dataset.cand; })[0];
        if(c) openGallery_(c);
      });
    });
    // radio → 手入力欄へ反映
    document.querySelectorAll('input[name^="cmt_"]').forEach(function(r){
      r.addEventListener('change', function(){
        var ta = document.querySelector('textarea.cmtEdit[data-cand="'+this.dataset.cand+'"]');
        var v = plainCmt(this.value);
        if(ta) ta.value = v;
        if(pick.id===this.dataset.cand){ pick.comment = v; refreshBar(); }
      });
    });
    document.querySelectorAll('textarea.cmtEdit').forEach(function(ta){
      ta.addEventListener('input', function(){ if(pick.id===this.dataset.cand){ pick.comment=this.value; refreshBar(); } });
    });
    // ch トグル
    document.querySelectorAll('.segch').forEach(function(seg){
      seg.querySelectorAll('.chBtn').forEach(function(b){
        b.addEventListener('click', function(){
          seg.querySelectorAll('.chBtn').forEach(function(x){ x.classList.remove('on'); });
          this.classList.add('on');
          if(pick.id===seg.dataset.cand){ pick.channel=this.dataset.ch; refreshBar(); }
        });
      });
    });
    // 決定
    document.querySelectorAll('.pickBtn').forEach(function(b){
      b.addEventListener('click', function(){
        var id=this.dataset.cand;
        var c = cands.filter(function(x){ return x.id===id; })[0]; if(!c) return;
        var ta = document.querySelector('textarea.cmtEdit[data-cand="'+id+'"]');
        var seg = document.querySelector('.segch[data-cand="'+id+'"] .chBtn.on');
        pick = { id:c.id, cid:c.cid, title:c.title, platform:c.platform,
          channel:(seg?seg.dataset.ch:candChannel(c)), comment:(ta?ta.value.trim():'') };
        document.querySelectorAll('.cand').forEach(function(el){ el.classList.remove('picked'); });
        $('#cand_'+id).classList.add('picked');
        refreshBar();
        $('#status').textContent=''; $('#status').className='status';
      });
    });
  }

  function refreshBar(){
    if(!pick.id){ $('#decbar').style.display='none'; return; }
    $('#decbar').style.display='block';
    var chName = pick.channel==='acc2'?'宵桜艶帖':'月詠み';
    $('#decSum').innerHTML = '決定: <b>'+esc(pick.title)+'</b><br>ch=<b>'+esc(chName)+'</b> / コメント=<b>'+esc(pick.comment||'(未入力)')+'</b>';
    $('#sendBtn').disabled = !(pick.comment && pick.comment.trim());
  }

  // ---- 送信 ----
  $('#sendBtn').addEventListener('click', function(){
    var url = gasUrl();
    if(!url){ setStatus('err','GAS URL が未設定です (設定を開いてください)。'); return; }
    if(!pick.id || !pick.comment.trim()){ setStatus('err','作品とコメントを選んでください。'); return; }
    var payload = { op:'teian_decide', secret:gasSecret(),
      date:(DATA&&DATA.date)||'', id:pick.id, cid:pick.cid, title:pick.title,
      platform:pick.platform, channel:pick.channel, comment:pick.comment.trim(),
      source:'teian-page', decidedAt:new Date().toISOString() };
    setStatus('busy','送信中…');
    $('#sendBtn').disabled=true;
    // Content-Type 無指定 = simple request (プリフライト回避・本体アプリと同方式)
    fetch(url, { method:'POST', body:JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok){
          var d = j.discord||'';
          setStatus('ok','決定を記録しました'+(d==='sent'?' / 軍議へエコー済み':(d?(' (Discordエコー: '+d+')'):''))+'。');
        } else { setStatus('err','失敗: '+((j&&j.error)||'不明')); $('#sendBtn').disabled=false; }
      })
      .catch(function(e){ setStatus('err','通信エラー: '+e); $('#sendBtn').disabled=false; });
  });
  function setStatus(cls,msg){ var s=$('#status'); s.className='status '+cls; s.textContent=msg; }

  // ---- 読み込み ----
  function load(obj){
    if(!obj || !obj.candidates){ renderEmpty('候補 JSON の形式が不正です (candidates が必要)。'); return; }
    DATA = obj; pick={ id:null,cid:null,title:null,platform:null,channel:null,comment:'' };
    try{ LS.setItem('teian_last_json', JSON.stringify(obj)); }catch(e){}
    render();
  }
  $('#file').addEventListener('change', function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ try{ load(JSON.parse(rd.result)); }catch(e){ renderEmpty('JSON を解釈できません: '+e); } };
    rd.readAsText(f);
  });
  $('#loadPaste').addEventListener('click', function(){
    var t=$('#paste').value.trim(); if(!t){ return; }
    try{ load(JSON.parse(t)); }catch(e){ renderEmpty('貼り付けを解釈できません: '+e); }
  });
  $('#loadUrl').addEventListener('click', function(){ fetchSrc(prompt('候補 JSON の URL')); });
  function fetchSrc(u){ if(!u) return;
    setStatusSafe('読み込み中…');
    fetch(u).then(function(r){ return r.json(); }).then(load)
      .catch(function(e){ renderEmpty('取得に失敗: '+e); });
  }
  function setStatusSafe(m){ $('#list').innerHTML='<div class="empty">'+esc(m)+'</div>'; }

  // ---- 当日候補の取り込み (sync-worker /api/teian/latest ・本体アプリと同一オリジン=同期設定を共有) ----
  //   PCの軍議が R2 へ置いた当日分を、本体アプリと同じ sync2_url/sync2_token で取り込む。
  function syncCfg(){
    var g=function(k){ try{ return (LS.getItem(k)||'').trim(); }catch(e){ return ''; } };
    return { url:g('sync2_url').replace(/\/+$/,''), token:g('sync2_token') };
  }
  function fetchDaily(manual){
    var c = syncCfg();
    if(!/^https?:\/\//.test(c.url) || !c.token){
      if(manual) renderEmpty('同期の設定が未完了です。本体アプリの ⚙同期 で URL と SYNC_TOKEN を登録してください (同じ端末なら1度で済みます)。');
      return Promise.resolve(false);
    }
    setStatusSafe('今日の候補を取得中…');
    return fetch(c.url+'/api/teian/latest', { headers:{'X-Sync-Token':c.token}, cache:'no-store' })
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(j){
        if(j && j.error==='bad_token'){ renderEmpty('同期トークンが一致しません。本体アプリの設定を確認してください。'); return false; }
        if(j && j.candidates && j.candidates.length){ load(j); return true; }
        if(manual) renderEmpty('今日の候補はまだ配信されていません (軍議の生成待ち)。');
        return false;
      })
      .catch(function(e){ if(manual) renderEmpty('取得に失敗: '+e); return false; });
  }
  $('#loadDaily').addEventListener('click', function(){ fetchDaily(true); });

  // 絞り込みの配線 + 動画生成用画像の読み込み(非同期・揃ったら描き直す・fail-open)
  initFilters_();
  loadRefMap_().then(function(m){ REF=m; if(DATA) render(); });

  // 起動: ?src= 優先 → 当日候補(同期) → 前回の読み込み → 空
  var qs = new URLSearchParams(location.search);
  if(qs.get('src')){ fetchSrc(qs.get('src')); }
  else {
    fetchDaily(false).then(function(got){
      if(got) return;
      var last = LS.getItem('teian_last_json');
      if(last){ try{ load(JSON.parse(last)); }catch(e){ renderEmpty('「🔄 今日の候補を読み込む」を押してください。'); } }
      else renderEmpty('「🔄 今日の候補を読み込む」を押してください (未配信なら軍議の生成待ち)。');
    });
  }
})();
</script>
</body>
</html>
