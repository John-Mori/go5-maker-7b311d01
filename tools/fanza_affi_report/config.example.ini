# FANZA/DMMアフィ売上レポート 設定サンプル
# このファイルを config.ini にコピーして、あなた自身の値を入れてください。
# ★資格情報(ID/パスワード)・実URL・Webhook URLはこのツールには同梱されていません。
#   ここに入れた値はあなたのPCの中だけです。config.ini 自体もgit管理外(.gitignore)です。
# ★採用方式は「腕A」のみです(保存済みセッションでの完全自動取得)。
#   毎朝手作業でCSVをダウンロードする運用(腕B)は不採用・未実装です。

[report]
# 送信本文の見出し
title = FANZAアフィ売上レポート

[input]
# アフィ管理画面からエクスポートしたCSVを置くフォルダ(mode=local で使用/mode=sessionの保存先にも使う)
csv_dir = <CSV保存フォルダのパス。例: C:\Users\あなた\fanza_affi_report\csv>
# 対象ファイルのパターン(mode=local のとき、このパターンの最新ファイルを使う)
csv_glob = *.csv
# 文字コード(DMMのCSVは cp932 = Shift-JIS)
encoding = cp932

[output]
# 送信口: stdout(画面表示・検証用) / discord(Webhook投稿。CSV添付あり) / mail(★未検証プレースホルダ)
sender = <discord か mail か stdout>

# --- sender = discord のとき使う ---
# あなたのDiscord Webhook URL(Discordサーバー設定 > 連携サービス > ウェブフック で発行)
webhook_url = <https://discord.com/api/webhooks/... をここに>

# --- sender = mail のとき使う(★未検証・実SMTP資格情報での送信確認はしていません) ---
smtp_host = <例: smtp.gmail.com>
smtp_port = 587
smtp_user = <SMTPユーザー名(未使用ならブランク可)>
smtp_password = <SMTPパスワード/アプリパスワード>
mail_from = <送信元メールアドレス>
mail_to = <宛先メールアドレス>

[state]
# 日次サマリの保存先(前日比・同日冪等性の判定に使う)
path = state/daily_summary.json

[log]
# ログの保存先
path = logs/fanza_affi_report.log

[schedule]
# 対象期間: yesterday(前日分。★腕A確定=毎朝これを送る) / today(当日分。動作確認用)
period = yesterday

[download]
# CSV取得方式:
#   local   = csv_dir に置いた最新CSVをそのまま使う(検証・移行期・手動運用の予備手段)
#   session = 保存済みセッションでDMMアフィ管理画面から自動取得する(★本番方式・腕A確定)
mode = <local か session>

# --- mode = session のときだけ使う(二層方式。ID/パスワードはどこにも書かない) ---
# 保存済みセッション(Chrome/Edgeの永続プロファイル)を置くフォルダ。
# 初回/失効時は relogin.bat(または `python -m fanza_affi_report.relogin`)を
# 1回手で実行すると、ここへログイン状態が保存される。
session_dir = sessions

# 使用ブラウザ: chrome か msedge。🐧さんの環境に合わせて選ぶ(既定 chrome)。
browser_channel = <chrome か msedge>

# レポート対象の絞り込みに使う af_id(アフィリエイトID)。不要なら空のまま。
affiliate_id = <af_id。不明/不要なら空欄>

# 再ログイン(relogin.bat)がブラウザを開くログイン画面URL。
login_url = <DMMアフィリエイト管理画面のログインURL>

# --- 第1層: エクスポートURL直叩き(速い。使えるなら優先) ---
# CSVエクスポートAPI/リンクのURLテンプレート。{date}/{affiliate_id} を埋め込み可。
# 例: https://affiliate.dmm.com/api/report/csv?from={date}&to={date}&af_id={affiliate_id}
# DevToolsのNetworkタブでCSVダウンロード時に飛んでいるリクエストURLをキャプチャして入れる。
# 分からない/使えない場合は空のままでよい(その場合は第2層のみで動く)。
export_url_template = <実物のエクスポートURL。DevToolsでキャプチャ。不明なら空欄>

# --- 第2層: フォールバック(レポート画面を開いてボタンをクリックしてDL) ---
# 直叩きが失敗/未設定のときに開く、レポート一覧/CSVエクスポートのページURL。
report_page_url = <レポート画面のURL>
# 「CSVエクスポート」ボタンのCSSセレクタ(DevToolsで要素を右クリック→コピー→セレクタ)。
csv_export_selector = <例: button.csv-export など>
