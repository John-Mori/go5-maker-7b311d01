# FANZA/DMMアフィ売上レポート 設定サンプル
# このファイルを config.ini にコピーして、あなた自身の値を入れてください。
# ★資格情報・URLはこのツールには同梱されていません。ここに入れた値はあなたのPCの中だけです。

[report]
# 送信本文の見出し
title = FANZAアフィ売上レポート

[input]
# アフィ管理画面からエクスポートしたCSVを置くフォルダ
csv_dir = C:\Users\あなた\Downloads\fanza_report
# 対象ファイルのパターン(このパターンの最新ファイルを使う)
csv_glob = *.csv
# 文字コード(DMMのCSVは cp932 = Shift-JIS)
encoding = cp932

[output]
# 送信口: stdout(画面表示) / discord(Webhook投稿)
sender = stdout
# sender = discord のとき、あなたのDiscord Webhook URL を入れる
webhook_url =

[state]
# 日次サマリの保存先(前日比の計算に使う)
path = state/daily_summary.json

[log]
# ログの保存先
path = logs/fanza_affi_report.log

[download]
# CSV取得方式: local(手動配置フォルダから拾う/検証用) / playwright(ブラウザ自動DL)
# ★裁定#1確定: 本番は playwright(完全自動)。🐧さんの手作業は無し。
mode = local

# --- mode = playwright のときだけ使う ---
# ★あなたのDMMログイン情報。ここにしか書かない(ソースに埋め込まない/同梱しない)。
username =
password =

# DMMアフィ管理画面(ログイン画面/レポート画面)の実物を見て埋める値。
# 当て推量で埋めるとログイン/DLが失敗するため、未確認の値は空のままにしておく。
login_url =
username_selector =
password_selector =
login_submit_selector =
report_url =
csv_export_selector =
