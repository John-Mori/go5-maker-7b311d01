name = "go5-drive-saver"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ── 観測（Workers Logs）──★save_job 完走本体の各終端ログ(console.warn/log)を Cloudflare 側で保持し、
#    `wrangler tail` / ダッシュボードで「保存がどの段で落ちたか」を実測できるようにする(2026-08-17 オタコン)。
[observability]
enabled = true

# ── 非秘密の設定（ここに秘密は書かない。秘密は wrangler secret put で登録）──
[vars]
# フロント(GitHub Pages)のOriginだけ許可（ワイルドカード不可）
ALLOWED_ORIGIN = "https://john-mori.github.io"
# 保存先フォルダID（SETUP.md の手順で取得して貼る。空のままだと保存されずエラー）
FOLDER_ID_ACC1 = "1B8444oTjKfvEEx6Wcb3BTUqW5TcKn1M-"   # 月詠み色恋劇場
FOLDER_ID_ACC2 = "12OnAu286z8Z0pCDz0bZb1khS3ydmmtwa"   # 宵桜艶帖～Yoizakura Tsuyacho～
# 1日あたりのアップロード上限（レート制限）
DAILY_LIMIT = "100"
# 同題名の上書きを有効化（Chami指示2026-08-13）。'1' の時だけ、フロントが overwrite=1 を送った保存で
# 窓内(作成30日以内)の同名フォルダを新規保存の"後"にゴミ箱送りする。空/他値なら従来どおり _2 連番で非破壊。
ALLOW_OVERWRITE = "1"
# 予備：ラベル一致用（任意。IDが主。未設定でも可）
LABEL_ACC1 = "月詠み色恋劇場"
LABEL_ACC2 = "宵桜艶帖～Yoizakura Tsuyacho～"

# ── 動画/画像の R2 バケット（sync-worker と共有）──★真因対策(2026-08-18 実測)：go5-drive-saver から
#    go5-sync.workers.dev への「同一アカウント workers.dev 間 fetch」は、外部curlが 200/8.7MB を返す同一URLでも
#    404 を返す(Cloudflareの既知の落とし穴)＝save_job が r2_video_missing で静死し「保存中のまま来ない」の真因。
#    → sync-worker が動画バイトを置く R2 バケットを drive-worker へ直バインドし、HTTP/クロスWorker を跨がず
#    env.SYNC_IMAGES.get(key) で in-process 直読みする。バケット名は sync-worker/wrangler.toml と同一。
[[r2_buckets]]
binding = "SYNC_IMAGES"
bucket_name = "go5-sync-images"

# ── レート制限用 KV（任意）──
# ※ CI(GitHub Actions)デプロイ時、この namespace id がアカウントに見つからず失敗したため一旦無効化。
#    Worker は RL バインディング不在でも安全に動作（rateLimited は env.RL 無しなら制限せず通す）。
#    防御は Origin制限＋共有シークレット＋最小操作(create専用)で維持。
#    日次上限を復活したい時は、Cloudflareで KV namespace を1つ作って下を有効化＋id を貼る。
# [[kv_namespaces]]
# binding = "RL"
# id = "（CloudflareのKV namespace id）"

# ── Secrets（コマンドで登録。ここには書かない）──
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put GOOGLE_REFRESH_TOKEN
#   wrangler secret put SHARED_SECRET
