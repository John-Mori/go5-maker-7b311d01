name: Frontend deploy smoke (恒久-3)

# フロント(GitHub Pages)を変えて push したら、公開URLの実物に対して薄いスモークを回す。
#   目的: 過去に最頻だったEクラス事故(版ずれ/キャッシュ/回帰)を、スマホ実機確認の前に機械で捕まえる。
#   公開リポなので Actions 分数は無制限=完全無料。手動実行(workflow_dispatch)も可。
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.js'
      - '**/*.mjs'        # ★門番スクリプト(scripts/check_*.mjs 等)自身の変更も検査する=門を直しても未検査で素通りしていた穴(2026-08-08)
      - '**/*.css'
      - 'assets/**'
      - 'schedule/**'     # ★カレンダー iframe の資産変更でもスモークを回す(版ずれ検査の対象領域そのもの)
      - '.github/workflows/smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 秘密ファイルが追跡に混入していないかの門番(INC-95=バックアップ設定がpublic repoへpushされた の再発防止)。
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 追跡ファイルに秘密が無いか検査
        run: |
          set -e
          # 追跡してはいけない厳密なファイル名/パス(誤検知を避けるため広いキーワード検索はしない)
          FORBIDDEN='^\.clasp\.json$|(^|/)\.clasprc\.json$|^scripts/gas_deploy_config\.json$|^scripts/scrape_config\.json$|^local/|(^|/)cli_auth_token\.txt$'
          HITS=$(git ls-files | grep -E "$FORBIDDEN" | grep -vE '\.example\.' || true)
          if [ -n "$HITS" ]; then
            echo "::error::秘密ファイルが追跡されています。gitignoreされているはずのものがコミットされました:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: 秘密ファイルの混入なし"

      # iOS Safari 固有のレイアウト崩れ(flex潰れ/%basis/背景落とし穴)を出す前に止める門。
      #   直近の最頻事故=PC/Chromeで再現せずiOSでだけ壊れるUIを実機未確認で出したこと(v=450/453/435)。
      - name: iOS Safari レイアウト検査
        run: node scripts/check_ui_ios.mjs

      # ボタンを「無闇に横へ引き伸ばす」CSS(flex:1 等)を出す前に止める門。
      #   前日24hの言い直し最多型=ボタンの幅(肥大化)の再発(🔥DEF-c7f98afd62/132b05c4b4 と同型が
      #   データ再作成ボタンで再発した・2026-08-16朝レビュー)。design-preferences §4.5 の🔥恒久対策を機構化。
      - name: ボタン幅(引き伸ばし)検査
        run: node scripts/check_button_width.mjs

      # 「全称スタイルの波及」を出す前に止める門。器のクラスへスコープしていない裸の要素セレクタ
      #   (グローバル button{width:100%} 型)に far-reaching プロパティを新規追加すると、後から足す部品が
      #   黙って継いで壊れる(INC-37/47・🔥ボタン幅 の再発源)。既存はBASELINEに退避し新規混入だけ弾く。
      #   型=docs/departments/kaizen-analyst/preflight_global-css-scope-bleed.md(改善提案部門アスナ依頼2026-08-16)。
      - name: 全称スタイル波及(裸セレクタ)検査
        run: node scripts/check_css_global_scope.mjs

      # 「外へ出る待ちに時限が無い」新規コードを止める門《番犬》。fetch/IndexedDB を AbortController/番犬タイマー
      #   無しで新規に書くと応答が返らない時「保存中…」が永久固着する(INC-108/116/125/132/134 の再発源)。
      #   既存はベースライン凍結し新規の裸待ちだけ弾く。型=preflight_net-wait-watchdog.md(アスナ依頼2026-08-16)。
      - name: 時限無しの待ち(番犬)検査
        run: node scripts/check_net_wait.mjs

      # 同名ヘルパを中身違いでコピーする新規の乖離を止める門《複製判断》。片方だけ直すと「直したのに再発」する
      #   (js/yt-clicks.js の isR2 4定義2変種・INC-112/134/140 の再発源)。既存の重複は凍結し新規の乖離だけ弾く。
      #   型=preflight_duplicate-helper.md(アスナ依頼2026-08-16)。
      - name: 同名ヘルパの乖離コピー検査
        run: node scripts/check_dup_helper.mjs

      # 共有状態へ非同期で書く時の「世代トークン(stale-guard)」の欠落を止める門《世代トークン》。
      #   古い応答が新しい状態を上書きする型(前の画像が残る/別作品に化ける/黒い無言箱)を作成時に止める。
      #   登録簿 scripts/check_gen_token.baseline.json の各カウンタに「採番(++X控え)＋照合(myGen!==X)」の
      #   両方が在ることをassertし、新規の未登録 *Seq/*Gen カウンタ(世代照合なしの共有書き込み)を落とす。
      #   同一「世代番号」解法を4回別実装した再発源(INC-07/15/135/139・INC-140の芯)。
      #   型=preflight_generation-token-on-shared-write.md(改善提案部門アスナ/AD研究室2026-08-18発注)。
      - name: 世代トークン(共有状態のstale-guard)検査
        run: node scripts/check_gen_token.mjs

      # シート由来行の編集値がリロードで消える型(作品URL/投稿先等)を、繋ぎの欠落として出す前に止める門。
      - name: シート保存連鎖の検査
        run: node scripts/check_sheet_chain.mjs

      # 「後埋まり列を直したと言うが実データで埋まるのを見ていない」型《実物着地》を止める門。
      #   ピーク値/クリック数/いいね等の後埋まり列(改修後N時間で毎時トリガーが埋める列)を、
      #   ソース文字列一致や「入れた」だけで閉じさせない。登録簿 scripts/backfill_columns.json を正に
      #   ①ヘッダ在②writer書込③読取口(action=backfill_probe)報告 を照合し、後埋まり列を新規に足したのに
      #   実データassert未登録の commit を新規混入として落とす。ピーク列は3回改修→8/15🔥(C-038/C-040)の型。
      #   型=preflight_claimed-fix-realdata-assert.md(改善提案部門アスナ/AD研究室2026-08-18発注)。
      - name: 後埋まり列の実データassert検査
        run: node scripts/check_backfill_assert.mjs

      # 作品ごとに導出する派生チェック(新作/準新作)を汎用persistが保存し、リロードで前作の値が残る型を止める門。
      #   準新作チェックが「翌日消えて二度と入らない」=EXCLUDE登録忘れ(4回目)の再発源(Chami報告2026-08-16①/
      #   改善提案部門アスナ analysis)。persistable()を抽出実行し data-derived の除外を実挙動で確認+
      #   割引/作品状態クラスの新規checkboxが未分類なら落とす。型=proposal_2026-08-16_movie-attrs-5recur.md。
      - name: 派生チェックのpersist分類検査
        run: node scripts/check_persist_derived.mjs

      # カレンダー iframe(schedule/)は本体とは別の独立バンプ領域で bump.mjs が触らない。
      #   中身を変えて ?v= を上げ忘れるとスマホが古い calendar を読む「版ずれ」=「直ってない」の再発源
      #   (2026-08-06朝レビュー: 前日24hで schedule 版を2度手バンプした型)。内容ハッシュで staleness を止める。
      - name: カレンダー(schedule/)版ずれ検査
        run: node scripts/check_schedule_ver.mjs

      # クリック集計(累計/週)の不変条件を固定する門。短縮コード差し替えで「累計0なのに週-16」等の
      #   矛盾が繰り返しChamiから再報告された型(2026-07-30朝レビュー)。積み直しロジックの静かな回帰を止める。
      - name: クリック集計の不変条件検査
        run: node scripts/check_click_recon.mjs

      # tests/test_*.js(同期方針カバレッジ/墓標/純関数群)を全push で実行する門。
      #   ★これまでCIは1本もnodeテストを回しておらず、同期漏れ検査(test_sync_coverage)等の安全網が
      #     「登録済みだが発火しない」状態だった(2026-08-04朝レビューで rank_mode 昇格の取りこぼしを検出)。
      #     『発火しない安全網は検証されない』を潰す=端末間同期漏れ(前日最頻の言い直し源)を出す前に止める。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: nodeテスト(同期方針/墓標/純関数)を全実行
        run: |
          set -e
          fail=0
          for t in tests/test_*.js; do
            echo "── $t ──"
            node "$t" || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "::error::nodeテストに失敗があります(上のログ参照)"
            exit 1
          fi
          echo "OK: 全 tests/test_*.js 緑"

  smoke:
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - uses: actions/checkout@v4

      - name: 今回pushの版(?v=N)を取り出す
        id: ver
        run: |
          V=$(grep -oE '\?v=[0-9]+' index.html | head -1 | grep -oE '[0-9]+')
          echo "expected=$V" >> "$GITHUB_OUTPUT"
          echo "今回の期待版: $V"

      - name: Pagesが今回の版を配信し始めるまで待つ(伝播の閉ループ)
        env:
          EXPECTED: ${{ steps.ver.outputs.expected }}
        run: |
          URL="https://john-mori.github.io/go5-maker-7b311d01/index.html"
          for i in $(seq 1 30); do
            # キャッシュを避けるためクエリを毎回変える
            BODY=$(curl -fsSL "$URL?cachebust=$i-$RANDOM" || true)
            LIVE=$(printf '%s' "$BODY" | grep -oE '\?v=[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            echo "試行 $i: 公開版=$LIVE / 期待版=$EXPECTED"
            if [ "$LIVE" = "$EXPECTED" ]; then echo "反映を確認"; exit 0; fi
            sleep 10
          done
          echo "::error::5分待っても公開版が $EXPECTED になりませんでした(Pagesビルド失敗 or 遅延)"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright導入
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: スモーク実行
        env:
          BASE_URL: https://john-mori.github.io/go5-maker-7b311d01/
          EXPECTED_VERSION: ${{ steps.ver.outputs.expected }}
        run: npx playwright test

      - name: レポート保全(失敗時の調査用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
