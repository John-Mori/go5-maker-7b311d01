<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ドラフト専用の軽量ページ(2026-08-12)。index.html の動画Canvas/背景動画/候補全画像を積まず、
     iOS Safariのメモリ都合によるページ破棄(戻ると勝手に再読込)を避ける。
     localStorage/IndexedDBは同一オリジンのindex.htmlと共有するため、ドラフト実データは分割・移動しない。 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ドラフト">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.webmanifest?v=776">
<link rel="apple-touch-icon" href="assets/icons/app-180.png?v=776">
<link rel="icon" type="image/png" href="assets/icons/app-192.png?v=776">
<title>ドラフト — 5秒動画メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=776">
<script>
window.__go5StockStandalone = true;
try {
  document.documentElement.setAttribute('data-tab', 'tabStock');
  var _a0 = localStorage.getItem('current_account') || 'acc1';
  document.documentElement.setAttribute('data-account', _a0 === 'acc2' ? 'acc2' : 'acc1');
  localStorage.setItem('go5_active_tab', 'tabStock');
} catch (e) {}
</script>
</head>
<body>
<header><h1>5秒動画メーカー</h1></header>

<div class="acct-bar">
  <span class="acct-bar-label">アカウント</span>
  <button id="acctBtn1" class="acct-btn active" type="button">月詠み色恋劇場</button>
  <button id="acctBtn2" class="acct-btn" type="button">宵桜艶帖～Yoizakura Tsuyacho～</button>
  <div class="acct-launch-row">
    <button id="reserveBtn" class="cal-launch-btn" type="button" data-overlay="reserveBtn">⏰ 予約</button>
    <button id="calBtn" class="cal-launch-btn" type="button" data-overlay="calBtn">📅 カレンダー</button>
    <button id="analyzeBtn" class="cal-launch-btn" type="button" onclick="try{localStorage.setItem('analytics_view','analyze')}catch(e){}location.href='analytics.html'">📊 分析</button>
    <button id="rankBtn" class="cal-launch-btn" type="button" onclick="try{localStorage.setItem('analytics_view','rank')}catch(e){}location.href='analytics.html'">🏆 ランキング</button>
  </div>
  <span class="acct-bar-note">アカウントごとに背景・Bluesky設定(ハンドル/アプリPW/本文/YouTube説明欄等)が切替わります。記録用GASは共通。</span>
</div>

<nav class="tabbar">
  <button id="tabCand" class="tab" data-nav="KouhoLists.html">💡 候補</button>
  <button id="tabVerify" class="tab" data-go="tabVerify">📋 投稿履歴</button>
  <button id="tabMovie" class="tab" data-go="tabMovie"><img class="emico" src="assets/icons/ic-movie.png?v=776" alt=""> 動画作成</button>
  <button id="tabStock" class="tab active">📦 ドラフト</button>
  <button id="tabYT" class="tab" data-go="tabYT"><svg viewBox="0 0 28 20" style="height:1em;width:1.4em;vertical-align:-0.18em" aria-hidden="true"><rect width="28" height="20" rx="6" fill="#FF0000"/><path d="M11 6 L11 14 L20 10 Z" fill="#fff"/></svg> 投稿</button>
  <button id="tabPost" class="tab" data-go="tabPost"><img class="emico" src="assets/icons/ic-bsky.png?v=776" alt=""> 投稿</button>
  <button id="tabAffi" class="tab" data-go="tabAffi"><img class="emico" src="assets/icons/ic-link.png?v=776" alt=""> AFIリンク</button>
  <button id="tabSettings" class="tab" data-go="tabSettings">⚙️ 詳細設定</button>
</nav>

<section id="pageStock"></section>
<!-- bluesky.jsは#bskyTextを起動条件にしている。分離したドラフトページでも投稿本文の
     短縮URL生成・セール選択・アカウント別ドメイン判定だけを共用するため、非表示ホストを置く。
     表示UIや自動投稿ボタンは持たないので、投稿そのものが発火することはない。 -->
<textarea id="bskyText" hidden aria-hidden="true"></textarea>
<input id="bskyWorkUrl" type="hidden" aria-hidden="true">
<input id="bskyHandle" type="hidden" aria-hidden="true">
<div id="pvImgWrap" hidden aria-hidden="true"><img id="pvImg" alt=""></div>

<!-- 投稿履歴一覧そのものは index.html に表示するが、yt-clicks.js は #ytClickList を起動条件にしている。
     ドラフト専用ページでも投稿完了APIを確実に初期化するため、非表示の処理ホストだけ置く。 -->
<div id="ytClickList" hidden aria-hidden="true"></div>

<script src="core/util.js?v=776"></script>
<script src="core/account.js?v=776"></script>
<script src="core/storage-keys.js?v=776"></script>
<script src="core/categories.js?v=776"></script>
<script src="core/movie-attrs-core.js?v=776"></script>
<script src="core/idb-store.js?v=776"></script>
<script src="core/sync.js?v=776"></script>
<script src="core/kaizen-log.js?v=776"></script>
<script src="idgen.js?v=776"></script>
<script src="promo-label.js?v=776"></script>
<script src="affiliate-core.js?v=776"></script>
<script src="fanza-core.js?v=776"></script>
<script src="bluesky-core.js?v=776"></script>
<script src="scheduler.js?v=776"></script>
<script src="bluesky.js?v=776"></script>
<script src="drive-upload.js?v=776"></script>
<script src="verify-core.js?v=776"></script>
<script src="schedule/data/holidays.js?v=776"></script>
<script src="hist-merge-core.js?v=776"></script>
<script src="rank-core.js?v=776"></script>
<script src="yt-clicks.js?v=776"></script>
<script src="stock.js?v=776"></script>
<script>
(function () {
  'use strict';
  function reflect(id) {
    var b1 = document.getElementById('acctBtn1'), b2 = document.getElementById('acctBtn2');
    if (b1) b1.classList.toggle('active', id === 'acc1');
    if (b2) b2.classList.toggle('active', id === 'acc2');
    document.documentElement.setAttribute('data-account', id === 'acc2' ? 'acc2' : 'acc1');
  }
  function setAcct(id) {
    try { localStorage.setItem('current_account', id); } catch (e) {}
    reflect(id);
    try { document.dispatchEvent(new CustomEvent('account-changed', { detail: { account: id } })); } catch (e) {}
  }
  var b1 = document.getElementById('acctBtn1'), b2 = document.getElementById('acctBtn2');
  if (b1) b1.addEventListener('click', function () { setAcct('acc1'); });
  if (b2) b2.addEventListener('click', function () { setAcct('acc2'); });
  var cur = 'acc1'; try { cur = localStorage.getItem('current_account') || 'acc1'; } catch (e) {}
  reflect(cur);

  document.querySelectorAll('.tabbar .tab[data-go]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      try { localStorage.setItem('go5_active_tab', btn.getAttribute('data-go')); } catch (e) {}
      location.href = 'index.html';
    });
  });
  document.querySelectorAll('.tabbar .tab[data-nav]').forEach(function (btn) {
    btn.addEventListener('click', function () { location.href = btn.getAttribute('data-nav'); });
  });
  var ts = document.getElementById('tabStock');
  if (ts) ts.addEventListener('click', function () { if (window.Go5Stock) window.Go5Stock.render(); });

  document.querySelectorAll('.acct-launch-row [data-overlay]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      try { sessionStorage.setItem('go5_open_overlay', btn.getAttribute('data-overlay')); } catch (e) {}
      location.href = 'index.html';
    });
  });

  if (window.Go5Stock) { try { window.Go5Stock.render(); } catch (e) {} }
}());
</script>
</body>
</html>
