<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 作品DBの作業場(2026-11-03 新設・Chami直令 ad研究室 msg 1566888121097003168/1566889169404428309)。
     5秒動画は廃止し、go5-maker のこの場所で NTR・人妻DBの「組む作業」(候補を見る・タグと説明を入れる)を行う。
     データは Worker works-db(D1 works_db)から合言葉付きで読む=作品の題名・画像は repo にも Pages の静的ファイルにも置かない。
     合言葉は本体と同じ localStorage sync2_token(同じオリジン・この端末だけ)。検索に載せない(noindex)。 -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1422">
<title>作品DB 作業場</title>
<style>
:root{--bg:#0e1422;--card:#1a2030;--ink:#eef2f7;--sub:#9fb0c3;--accent:#2bb3c0;--warn:#e0a040;--bad:#dc465a;--line:#2a3346;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5;}
[hidden]{display:none !important;}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
header h1{font-size:17px;margin:0;flex:1 1 auto;min-width:0;}
main{padding:10px 12px 80px;max-width:760px;margin:0 auto;}
button{font:inherit;width:auto;flex:0 0 auto;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;}
button.on{background:var(--accent);border-color:var(--accent);color:#0e1422;font-weight:700;}
button.primary{background:var(--accent);border-color:var(--accent);color:#0e1422;font-weight:700;padding:9px 18px;}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.note{color:var(--sub);font-size:13px;}
.msg{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin:10px 0;}
.msg.bad{border-color:var(--bad);}
.msg.ok{border-color:var(--accent);}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;cursor:pointer;}
.thumb{flex:0 0 96px;width:96px;height:96px;border-radius:6px;background:#0a0f1a;overflow:hidden;position:relative;}
.thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;background:#0a0f1a;}
.thumb .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);text-align:center;padding:4px;}
.info{flex:1 1 auto;min-width:0;}
.title{font-weight:700;overflow-wrap:anywhere;}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;color:var(--sub);}
.badge.done{border-color:var(--accent);color:var(--accent);}
.badge.todo{border-color:var(--warn);color:var(--warn);}
.def{margin:14px 0;}
.def .lab{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px;}
input[type=text],textarea,select{font:inherit;font-size:16px;width:100%;min-width:0;max-width:100%;background:#0a0f1a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;}
select{width:auto;max-width:320px;-webkit-appearance:none;appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;}
select option{background:#0a0f1a;color:var(--ink);}
textarea{min-height:140px;resize:vertical;}
.head{display:flex;gap:10px;margin:6px 0 10px;}
.savebar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;margin-top:16px;}
a{color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1 id="hd">作品DB 作業場(NTR・人妻)</h1>
  <button id="backBtn" type="button" hidden>一覧へ戻る</button>
</header>
<main>
  <div id="topMsg" class="msg" hidden></div>

  <section id="listView" hidden>
    <div class="row" id="filters"></div>
    <p class="note" id="listNote"></p>
    <div id="list"></div>
    <div class="row" id="pager"></div>
  </section>

  <section id="editView" hidden>
    <div class="head">
      <div class="thumb" id="edThumb"></div>
      <div class="info">
        <div class="title" id="edTitle"></div>
        <div class="note" id="edSub"></div>
        <div class="row" style="margin-top:6px"><a id="edLink" target="_blank" rel="noopener noreferrer">商品ページを開く</a></div>
      </div>
    </div>
    <div class="row">
      <span class="note">入力する範囲</span>
      <select id="storySel"></select>
    </div>
    <div id="defs"></div>
    <div class="def" id="bodyWrap">
      <div class="lab">説明(作品全体だけ)</div>
      <textarea id="bodyTa"></textarea>
      <div class="note" id="bodyCount"></div>
    </div>
    <div class="savebar">
      <div class="row"><button id="saveBtn" class="primary" type="button">保存する</button><span class="note" id="saveSt"></span></div>
      <div id="saveErr" class="msg bad" hidden></div>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var API = "https://works-db.trustsignalbot.workers.dev";
  try { var o = new URLSearchParams(location.search).get("api"); if (o && /^http:\/\/127\.0\.0\.1:\d+$/.test(o)) API = o; } catch (e) {}
  var PAGE = 30;
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = (localStorage.getItem("sync2_token") || "").trim(); } catch (e) {}

  var works = [], filter = "all", page = 0, cur = null, sel = {}, clearSet = {}, dirtyBody = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function show(el, on) { el.hidden = !on; }
  function topMsg(text, kind) { var m = $("topMsg"); m.className = "msg" + (kind ? " " + kind : ""); m.textContent = text; show(m, !!text); }

  function api(path, data) {
    var opt = { headers: { "X-Sync-Token": token }, cache: "no-store" };
    if (data) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(data); }
    return fetch(API + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; });
    });
  }

  // 同人は作品の種類で置き場が違う(コミック/ゲーム/CG/音声)。無い置き場は now_printing(90x122)へ飛ぶので、それも外れとして次を試す
  var DOUJIN_DIRS = ["comic", "game", "cg", "voice"];
  function imgUrls(w) {
    if (w.service === "doujin") return DOUJIN_DIRS.map(function (k) { return "https://doujin-assets.dmm.co.jp/digital/" + k + "/" + w.cid + "/" + w.cid + "pl.jpg"; });
    return ["https://ebook-assets.dmm.co.jp/digital/e-book/" + w.cid + "/" + w.cid + "pl.jpg"];
  }
  function thumbHtml(w) {
    return '<img referrerpolicy="no-referrer" alt="" data-urls="' + esc(imgUrls(w).join(" ")) + '">' +
      '<span class="noimg">画像が読めない</span>';
  }
  function nextImg(img) {
    var urls = (img.getAttribute("data-urls") || "").split(" ").filter(Boolean);
    if (!urls.length) { img.remove(); return; }
    img.setAttribute("data-urls", urls.slice(1).join(" "));
    img.src = urls[0];
  }
  function startImgs(root) {
    Array.prototype.forEach.call(root.querySelectorAll("img[data-urls]"), function (img) {
      img.onerror = function () { nextImg(img); };
      img.onload = function () { if (img.naturalWidth === 90 && img.naturalHeight === 122) nextImg(img); else img.removeAttribute("data-urls"); };
      nextImg(img);
    });
  }

  // ---- 一覧 ----
  var FILTERS = [["all", "すべて"], ["NTR", "NTR"], ["人妻", "人妻・熟女"], ["両方", "両方"], ["todo", "タグ未入力"]];
  function renderFilters() {
    $("filters").innerHTML = FILTERS.map(function (f) {
      return '<button type="button" data-f="' + f[0] + '" class="' + (filter === f[0] ? "on" : "") + '">' + esc(f[1]) + "</button>";
    }).join("");
  }
  function filtered() {
    return works.filter(function (w) {
      if (filter === "all") return true;
      if (filter === "todo") return !w.tag_n;
      return w.sec === filter;
    });
  }
  function renderList() {
    renderFilters();
    var all = filtered(), n = all.length, pages = Math.max(1, Math.ceil(n / PAGE));
    if (page >= pages) page = pages - 1;
    var part = all.slice(page * PAGE, page * PAGE + PAGE);
    var done = works.filter(function (w) { return w.tag_n; }).length;
    $("listNote").textContent = "全" + works.length + "作品のうちタグ入力済み" + done + "件。表示" + n + "件。";
    $("list").innerHTML = n ? part.map(function (w) {
      return '<div class="card" data-cid="' + esc(w.cid) + '"><div class="thumb">' + thumbHtml(w) + '</div><div class="info">' +
        '<div class="title">' + esc(w.title) + "</div>" +
        '<div class="note">' + esc(w.maker) + (w.review_count ? " / レビュー" + w.review_count + "件(" + w.review_avg + ")" : "") + "</div>" +
        '<span class="badge">' + esc(w.sec === "人妻" ? "人妻・熟女" : w.sec) + "</span>" +
        '<span class="badge ' + (w.tag_n ? "done" : "todo") + '">' + (w.tag_n ? "タグ" + w.tag_n + "項目" : "タグ未入力") + "</span>" +
        (w.story_n ? '<span class="badge">話別' + w.story_n + "話</span>" : "") +
        '<span class="badge ' + (w.body_len >= 300 ? "done" : "") + '">説明' + w.body_len + "/300字</span>" +
        "</div></div>";
    }).join("") : '<p class="msg">この絞り込みに当たる作品は無い(' + esc(FILTERS.filter(function (f) { return f[0] === filter; })[0][1]) + ")。</p>";
    startImgs($("list"));
    $("pager").innerHTML = pages > 1 ? Array.from({ length: pages }, function (_, i) {
      return '<button type="button" data-p="' + i + '" class="' + (i === page ? "on" : "") + '">' + (i + 1) + "</button>";
    }).join("") : "";
  }
  function loadList() {
    topMsg("読み込み中…");
    return api("/api/works").then(function (r) {
      if (r._status === 403) return topMsg("合言葉が通らない。本体の詳細設定の同期トークンが、この端末に入っているか見てほしい。", "bad");
      if (!r.ok) return topMsg("一覧が読めない(" + (r.error || r._status) + ")。", "bad");
      works = r.works || [];
      topMsg(works.length ? "" : "D1 にまだ作品が無い(sync_d1.py push 前)。");
      renderList();
    }).catch(function (e) { topMsg("Worker に届かない(" + e + ")。", "bad"); });
  }

  // ---- 入力画面 ----
  function openWork(cid, story) {
    topMsg("読み込み中…");
    $("saveSt").textContent = ""; show($("saveErr"), false);
    return api("/api/work?cid=" + encodeURIComponent(cid) + "&story=" + story).then(function (r) {
      if (!r.ok) return topMsg("作品が読めない(" + (r.error || r._status) + ")。", "bad");
      topMsg("");
      cur = r; sel = {}; clearSet = {}; dirtyBody = false;
      r.defs.forEach(function (d) {
        var v = r.current[d.key];
        if (d.choices) sel[d.key] = v ? (r.multi.indexOf(d.key) >= 0 ? v.split(r.join) : [v]) : [];
      });
      renderEdit();
      show($("listView"), false); show($("editView"), true); show($("backBtn"), true);
      window.scrollTo(0, 0);
    }).catch(function (e) { topMsg("Worker に届かない(" + e + ")。", "bad"); });
  }
  function renderEdit() {
    var r = cur, w = r.work;
    $("edThumb").innerHTML = thumbHtml(w);
    startImgs($("edThumb"));
    $("edTitle").textContent = w.title;
    $("edSub").textContent = (w.maker || "") + " / " + (r.sec === "人妻" ? "人妻・熟女" : r.sec) + (w.campaign ? " / " + w.campaign : "");
    $("edLink").href = w.url;
    var opts = ['<option value="0">作品全体' + (r.used.indexOf(0) >= 0 ? "(入力あり)" : "") + "</option>"];
    for (var i = 1; i <= r.max_story; i++) opts.push('<option value="' + i + '">第' + i + "話" + (r.used.indexOf(i) >= 0 ? "(入力あり)" : "") + "</option>");
    $("storySel").innerHTML = opts.join(""); $("storySel").value = String(r.story);
    $("defs").innerHTML = r.defs.map(function (d) {
      if (!d.choices) {
        var v = r.current[d.key] || "";
        var inp = d.key === "memo" ? '<textarea data-k="' + d.key + '" style="min-height:70px">' + esc(v) + "</textarea>"
          : '<input type="text" data-k="' + d.key + '" value="' + esc(v) + '">';
        return '<div class="def"><div class="lab">' + esc(d.label) + "</div>" + inp + "</div>";
      }
      return '<div class="def"><div class="lab">' + esc(d.label) + '</div><div class="row" data-def="' + d.key + '">' +
        d.choices.map(function (c) {
          return '<button type="button" data-c="' + esc(c) + '" class="' + (sel[d.key].indexOf(c) >= 0 ? "on" : "") + '">' + esc(c) + "</button>";
        }).join("") + "</div></div>";
    }).join("");
    show($("bodyWrap"), r.story === 0);
    $("bodyTa").value = r.story === 0 ? (r.page.body || "") : "";
    countBody();
  }
  function countBody() {
    var n = $("bodyTa").value.trim().length;
    $("bodyCount").textContent = n + "/" + cur.body_target + "字";
  }
  function toggle(key, c) {
    var multi = cur.multi.indexOf(key) >= 0, s = sel[key], had = s.indexOf(c) >= 0;
    if (!multi) { sel[key] = had ? [] : [c]; if (had) clearSet[key] = 1; else delete clearSet[key]; }
    else {
      var ex = key === "avoid" ? "なし" : null;
      if (had) sel[key] = s.filter(function (x) { return x !== c; });
      else if (ex && c === ex) sel[key] = [ex];
      else sel[key] = s.filter(function (x) { return x !== ex; }).concat([c]);
      if (!sel[key].length) clearSet[key] = 1; else delete clearSet[key];
    }
    var box = document.querySelector('[data-def="' + key + '"]');
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) { b.classList.toggle("on", sel[key].indexOf(b.getAttribute("data-c")) >= 0); });
  }
  function save() {
    var r = cur, fields = {}, clear = Object.keys(clearSet);
    r.defs.forEach(function (d) {
      if (d.choices) { if (sel[d.key].length) fields[d.key] = sel[d.key]; }
      else { var el = document.querySelector('[data-k="' + d.key + '"]'); fields[d.key] = [el.value]; }
    });
    var q = { cid: r.work.cid, story: r.story, fields: fields, clear: clear };
    if (r.story === 0) q.body = $("bodyTa").value;
    $("saveSt").textContent = "保存中…"; show($("saveErr"), false);
    api("/api/work", q).then(function (res) {
      if (!res.ok) {
        $("saveSt").textContent = "保存できていない";
        $("saveErr").innerHTML = (res.errors || [res.error || ("HTTP " + res._status)]).map(esc).join("<br>");
        show($("saveErr"), true);
        return;
      }
      // 保存できたかは読み直した中身で確かめてから言う
      return api("/api/work?cid=" + encodeURIComponent(r.work.cid) + "&story=" + r.story).then(function (back) {
        if (!back.ok) { $("saveSt").textContent = "保存の確認ができていない(" + (back.error || back._status) + ")"; return; }
        cur = back; clearSet = {};
        renderEdit();
        $("saveSt").textContent = "保存した " + String(res.saved_at || "").slice(11, 16);
        var w = works.filter(function (x) { return x.cid === r.work.cid; })[0];
        if (w && r.story === 0) { w.tag_n = Object.keys(back.current).length; w.body_len = (back.page.body || "").length; }
      });
    }).catch(function (e) { $("saveSt").textContent = "保存できていない(Worker に届かない: " + e + ")"; });
  }
  function backToList() {
    show($("editView"), false); show($("backBtn"), false); show($("listView"), true); cur = null;
    renderList();
  }

  // ---- つなぎ ----
  $("filters").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; filter = b.getAttribute("data-f"); page = 0; renderList(); });
  $("pager").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; page = +b.getAttribute("data-p"); renderList(); });
  $("list").addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) openWork(c.getAttribute("data-cid"), 0); });
  $("defs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    toggle(b.parentNode.getAttribute("data-def"), b.getAttribute("data-c"));
  });
  $("storySel").addEventListener("change", function () { openWork(cur.work.cid, +this.value); });
  $("bodyTa").addEventListener("input", countBody);
  $("saveBtn").addEventListener("click", save);
  $("backBtn").addEventListener("click", function () { loadList(); backToList(); });

  if (!token) {
    topMsg("この端末に同期トークンが無いので開けない。本体の詳細設定で同期(sync2)を設定した端末で開いてほしい。", "bad");
  } else {
    show($("listView"), true);
    loadList();
  }
})();
</script>
</body>
</html>
